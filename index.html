<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay</title>
    <link rel="stylesheet" href="main.css" />
</head>

<body>
    <nav class="bg-blue-900">
        <div class="relative w-[1080px] mx-auto flex items-center justify-between">
            <!--logo -->
            <a href="/" class="cursor-pointer py-7 pr-7">
                <img src="./images/razorpay.svg" width="125px" height="30px" />
            </a>
            <ul class="flex gap-6">
                <li
                    class="text-white py-7 hover:text-blue-500 curson-pointer transition-all duration-200 group relative">
                    <a href="#">payment</a>
                    <div
                        class="absolute bottom-0 w-full h-1 bg-blue-500 hidden group-hover:block transition-all duration-200">
                    </div>
                </li>
                <li
                    class="text-white py-7 hover:text-blue-500 curson-pointer transition-all duration-200 group relative">
                    <a href="#">Banking</a>
                    <div
                        class="absolute bottom-0 w-full h-1 bg-blue-500 hidden group-hover:block transition-all duration-200">
                    </div>
                </li>
                <li
                    class="text-white py-7 hover:text-blue-500 curson-pointer transition-all duration-200 group relative">
                    <a href="#">Corporate Card</a>

                </li>
                <li
                    class="text-white py-7 hover:text-blue-500 curson-pointer transition-all duration-200 group relative">
                    <a href="#">Payroll</a>

                </li>
                <li
                    class="text-white py-7 hover:text-blue-500 curson-pointer transition-all duration-200 group relative">
                    <a href="#">Resources</a>
                    <div
                        class="absolute bottom-0 w-full h-1 bg-blue-500 hidden group-hover:block transition-all duration-200">
                    </div>
                </li>
                <li
                    class="text-white py-7 hover:text-blue-500 curson-pointer transition-all duration-200 group relative">
                    <a href="#">Support</a>
                    <div
                        class="absolute bottom-0 w-full h-1 bg-blue-500 hidden group-hover:block transition-all duration-200">
                    </div>
                </li>
                <li
                    class="text-white py-7 hover:text-blue-500 curson-pointer transition-all duration-200 group relative">
                    <a href="#">Pricing</a>
                    <div
                        class="absolute bottom-0 w-full h-1 bg-blue-500 hidden group-hover:block transition-all duration-200">
                    </div>
                </li>
            </ul>

            <div class="flex space-x-4">
                <img src="./images/indian-flag.png" width="28px" hight="28px" />
                <button class="py-3 px-5 text-white border-blue-500 border-2 rounded-sm text-sm font-bold">Log
                    in</button>
                <button
                    class="flex gap-1 py-3 px-4 text-blue-900 border border-2 text-sm font-bold rounded-sm bg-white transition-all duration-300 hover:text-blue-700">Sign
                    up
                    <img src="./images/arrow-signUp.png" width="20px" height="18px" /></button>
            </div>
        </div>
    </nav>

    <!--Hero section-->
    <section class="relation bg-blue-900">
        <div class="w:10/12 flex flex-row justify-between items-center mx-auto">
            <!--Left part -->
            <div class="flex flex-col gap-4">
                <h1>Power your finance, grow your business</h1>
                <div class="w-6 h-1 bg-green-100"></div>
                <p>Accept payments from customers. Automate payouts to vendors & employes. Never run out of working
                    capital</p>
                <button>Sign Up Now</button>
            </div>
            <!--Right part -->
            <img src="./images/hero.png" alt="" />
        </div>
        <!--shape side-->
        <img src="" alt="" />
    </section>
</body>

</html>
